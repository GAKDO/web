# 정적 파일을 8080에서 내준다(nginx-unprivileged라 루트 권한 없이 돈다). 새로고침해도 SPA 라우트가 깨지지 않게 index.html로 돌린다
# listen은 시작할 때 docker/40-trace-tls.sh가 만든다: 인증서가 마운트돼 있으면 HTTPS(8080 ssl), 없으면 HTTP

server {
  include /tmp/nginx/listen.conf;
  # 앞단 프록시를 믿을 때만 실제 사용자 IP로 바꾼다(docker/41-trace-upstreams.sh, TRUSTED_PROXIES. 비면 빈 파일)
  include /tmp/nginx/realip.conf;
  root /usr/share/nginx/html;
  index index.html;
  location / {
    # index.html은 매번 새로 확인한다(배포 뒤 옛 화면이 캐시에 남지 않게). 해시가 붙은 /assets/만 오래 둔다
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location = /version.txt {
    add_header Cache-Control "no-store";
  }
  # API 입구. 로컬 Compose·학교 서버에서는 web 하나가 입구라 /api/를 gateway로 넘긴다(경로는 그대로).
  # 클러스터는 Cloudflare Tunnel이 /api/를 먼저 gateway로 보내 여기까지 오지 않는다.
  # 검사 진행률 SSE가 끊기지 않게 버퍼링을 끄고 읽기 시간을 늘린다
  location /api/ {
    include /tmp/nginx/api.conf;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 5m;
  }
  # 사진 올리기·받기(사전 서명 URL). capture-server가 URL 앞부분을 MINIO_PUBLIC_BASE(이 web 주소)로 바꿔 주므로
  # HTTPS 화면에서 http:// MinIO를 직접 부르지 않는다(혼합 콘텐츠). 서명에 MinIO Host가 들어 있어 Host를 MinIO 주소로 보낸다.
  # 버킷 목록 같은 객체 밖 요청은 막고, 객체 GET·HEAD·PUT만 넘긴다(권한은 서명이 정한다)
  location ~ ^/(trace-captures|trace-derived)/?$ {
    return 404;
  }
  location ~ ^/(trace-captures|trace-derived)/ {
    limit_except GET HEAD PUT {
      deny all;
    }
    # 사전 서명 PUT에 서명되지 않은 복사 헤더를 붙여 다른 객체를 복사해 오는(CopyObject) 요청은 받지 않는다
    if ($http_x_amz_copy_source) {
      return 403;
    }
    # 사전 서명 쿼리(서명·자격 범위)가 접근 로그에 남지 않게 이 경로는 기록하지 않는다
    access_log off;
    include /tmp/nginx/minio.conf;
    proxy_pass http://$minio_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $minio_host;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 64m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}
