# 정적 파일을 8080에서 내준다(nginx-unprivileged라 루트 권한 없이 돈다). 새로고침해도 SPA 라우트가 깨지지 않게 index.html로 돌린다
# listen은 시작할 때 docker/40-trace-tls.sh가 만든다: 인증서가 마운트돼 있으면 HTTPS(8080 ssl), 없으면 HTTP

# WebSocket(Grafana Live)이면 Connection: upgrade, 아니면 keep-alive 없이 닫는다
map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

server {
  include /tmp/nginx/listen.conf;
  root /usr/share/nginx/html;
  index index.html;
  location / {
    try_files $uri $uri/ /index.html;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location = /version.txt {
    add_header Cache-Control "no-store";
  }
  # 파일럿 추이 Grafana(클러스터의 grafana:3000)를 같은 주소 아래 /grafana/로 연다.
  # Grafana는 GF_SERVER_SERVE_FROM_SUB_PATH=true라 /grafana/ 접두사를 그대로 받는다(경로를 바꾸지 않는다)
  location = /grafana {
    absolute_redirect off;
    return 301 /grafana/;
  }
  location /grafana/ {
    # resolver와 $grafana_upstream은 시작할 때 docker/41-trace-grafana.sh가 만든다
    include /tmp/nginx/grafana.conf;
    proxy_pass http://$grafana_upstream;
    proxy_http_version 1.1;
    # Grafana가 Origin과 Host를 비교하므로 Host를 그대로 넘긴다
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
  }
}
