# 정적 파일을 8080에서 내준다(nginx-unprivileged라 루트 권한 없이 돈다). 새로고침해도 SPA 라우트가 깨지지 않게 index.html로 돌린다
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  location / {
    try_files $uri $uri/ /index.html;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
