# 정적 파일을 8080에서 내준다(nginx-unprivileged라 루트 권한 없이 돈다). 새로고침해도 SPA 라우트가 깨지지 않게 index.html로 돌린다
# listen은 시작할 때 docker/40-trace-tls.sh가 만든다: 인증서가 마운트돼 있으면 HTTPS(8080 ssl), 없으면 HTTP

# WebSocket(Grafana Live)이면 Connection: upgrade, 아니면 keep-alive 없이 닫는다
map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

server {
  include /tmp/nginx/listen.conf;
  root /usr/share/nginx/html;
  index index.html;
  location / {
    try_files $uri $uri/ /index.html;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location = /version.txt {
    add_header Cache-Control "no-store";
  }
  # 파일럿 추이 Grafana(클러스터의 grafana:3000)를 같은 주소 아래 /grafana/로 연다.
  # Grafana는 GF_SERVER_SERVE_FROM_SUB_PATH=true라 /grafana/ 접두사를 그대로 받는다(경로를 바꾸지 않는다)
  location = /grafana {
    absolute_redirect off;
    return 301 /grafana/;
  }
  location /grafana/ {
    # resolver와 $grafana_upstream은 시작할 때 docker/41-trace-upstreams.sh가 만든다
    include /tmp/nginx/grafana.conf;
    proxy_pass http://$grafana_upstream;
    proxy_http_version 1.1;
    # Grafana가 Origin과 Host를 비교하므로 Host를 그대로 넘긴다
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
  }

  # API 입구. 로컬 Compose·학교 서버에서는 web 하나가 입구라 /api/를 gateway로 넘긴다(경로는 그대로).
  # 클러스터는 Cloudflare Tunnel이 /api/를 먼저 gateway로 보내 여기까지 오지 않는다.
  # 검사 진행률 SSE가 끊기지 않게 버퍼링을 끄고 읽기 시간을 늘린다
  location /api/ {
    include /tmp/nginx/api.conf;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 5m;
  }
  # 사진 올리기·받기(사전 서명 URL). capture-server가 URL 앞부분을 MINIO_PUBLIC_BASE(이 web 주소)로 바꿔 주므로
  # HTTPS 화면에서 http:// MinIO를 직접 부르지 않는다(혼합 콘텐츠). 서명에 MinIO Host가 들어 있어 Host를 MinIO 주소로 보낸다.
  # 버킷 목록 같은 객체 밖 요청은 막고, 객체 GET·HEAD·PUT만 넘긴다(권한은 서명이 정한다)
  location ~ ^/(trace-captures|trace-derived)/?$ {
    return 404;
  }
  location ~ ^/(trace-captures|trace-derived)/ {
    limit_except GET HEAD PUT {
      deny all;
    }
    include /tmp/nginx/minio.conf;
    proxy_pass http://$minio_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $minio_host;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 64m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}
