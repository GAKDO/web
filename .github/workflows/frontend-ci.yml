# 화면(Vite·React·TypeScript) 검사. (블로그 frontend-ci.yml을 옮김)
name: 화면 CI

# 언제 도나: ① PR ② develop push ③ 배포(deploy.yml)가 이미지 전에 불러 쓸 때(workflow_call)
# 흐름: 의존성 설치 → 타입 검사 → 테스트 → 배포용 빌드. 하나라도 실패하면 빨간불
on:
  pull_request:
    paths-ignore: ["**/*.md"]
  push:
    branches: [develop]
    paths-ignore: ["**/*.md"]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # lock 파일 그대로 설치. lock과 package.json이 어긋나면 실패해 '내 컴퓨터에선 됐는데'를 막는다
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
