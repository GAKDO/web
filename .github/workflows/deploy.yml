# 이미지를 만들어 GHCR에 올리고, main이면 gitops 레포의 이미지 태그를 바꿔 Argo CD가 학교 클러스터에 반영하게 한다.
name: 배포

# ─── 흐름 (블로그 deploy.yml에서 클러스터에 직접 배포하던 부분만 Argo CD 방식으로 바꿈) ───
# [PR]           이미지 빌드만 해 보고 올리지 않음 (테스트는 화면 CI이 PR에서 따로 돈다)
# [develop push] 테스트 → 이미지(:커밋SHA·:develop)를 GHCR에 올림. 배포하지 않음
# [main push]    테스트 → 이미지(:커밋SHA·:latest) → gitops 레포 overlays/school의 이미지 태그를 커밋SHA로 바꿈
#                → 학교 서버의 Argo CD가 그 커밋을 읽어 trace 네임스페이스에 반영(자동 동기화)
#                → 연기 시험: 바깥 주소가 이번 커밋으로 응답하는지 확인(변수 SMOKE_API_URL·SMOKE_WEB_URL)
#                → 12분 안에 안 되면 자동 롤백: 방금 올린 gitops 커밋을 되돌려 Argo CD가 직전 버전으로 맞춤
# 필요한 값: Secret GITOPS_TOKEN(gitops 레포 Contents 쓰기만 준 fine-grained 토큰, 조직 Secret 하나로 공유).
#            없으면 이미지까지만 올리고 gitops 갱신은 안내만 남긴다
# ────────────────────────────────────────────────────────────
on:
  pull_request:
    paths-ignore: ["**/*.md"]
  push:
    branches: [main, develop]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

env:
  APP: ${{ github.event.repository.name }}
  GITOPS_REPO: ${{ github.repository_owner }}/gitops
  KUSTOMIZE_VERSION: "5.7.1"

jobs:
  # main·develop에 합쳐진 결과를 이미지 전에 한 번 더 테스트한다. PR에서는 화면 CI이 따로 돈다
  test:
    name: 테스트
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/frontend-ci.yml
    secrets: inherit

  image:
    name: 이미지 빌드
    needs: test
    # PR에서는 test가 건너뛰어지므로, 건너뜀도 통과로 본다
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      service: ${{ steps.name.outputs.service }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # GHCR 이미지 이름은 소문자만 된다 (조직 GAKDO → gakdo)
      # 쿠버네티스 이름에는 밑줄(_)을 쓸 수 없어서 레포 이름의 _를 -로 바꾼다 (auth_server 레포 → auth-server 서비스·이미지)
      - name: 이미지 이름 정하기
        id: name
        run: |
          svc="${APP//_/-}"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${svc}" >> "$GITHUB_ENV"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${svc}" >> "$GITHUB_OUTPUT"
          echo "service=${svc}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 학교 클러스터는 amd64라 한 가지만 만든다(블로그는 Oracle ARM VM 때문에 arm64도 만들었다)
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.IMAGE) || '' }}
            ${{ github.ref == 'refs/heads/develop' && format('{0}:develop', env.IMAGE) || '' }}
          build-args: |
            APP_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # gitops 레포의 이미지 태그를 바꾼다. 클러스터에는 접속하지 않는다(실제 반영은 Argo CD)
  gitops:
    name: gitops 이미지 태그 갱신
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # 이 레포 안에서는 한 줄로 세운다(concurrency는 레포 단위). 다른 레포와 겹치면 아래 단계가 받아서 다시 시도한다
    concurrency:
      group: gitops-bump
      cancel-in-progress: false
    outputs:
      pushed: ${{ steps.bump.outputs.pushed }}
      commit: ${{ steps.bump.outputs.commit }}
    env:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
    steps:
      - name: 토큰 확인
        id: token
        run: |
          if [ -z "$GITOPS_TOKEN" ]; then
            echo "::notice::Secret GITOPS_TOKEN이 없어 gitops 갱신을 건너뜁니다. 이미지는 GHCR에 올라갔습니다."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.token.outputs.ok == 'true'
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main
          path: gitops
      - name: kustomize 설치
        if: steps.token.outputs.ok == 'true'
        run: curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | sudo tar xz -C /usr/local/bin
      # 다른 서버가 먼저 커밋했으면 받아서 다시 시도한다(최대 3번). 롤백할 수 있게 올린 커밋을 남긴다
      - name: 이미지 태그 바꾸고 커밋
        id: bump
        if: steps.token.outputs.ok == 'true'
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          SERVICE: ${{ needs.image.outputs.service }}
        working-directory: gitops
        run: |
          git config user.name "trace-ci"
          git config user.email "trace-ci@users.noreply.github.com"
          for i in 1 2 3; do
            git pull --rebase -q origin main
            (cd overlays/school && kustomize edit set image "${SERVICE}=${IMAGE}:${GITHUB_SHA}")
            if git diff --quiet; then echo "이미 같은 태그입니다."; exit 0; fi
            git commit -qam "deploy(${SERVICE}): ${GITHUB_SHA::7}" -m "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
            if git push -q origin HEAD:main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              echo "gitops 갱신 완료"; exit 0
            fi
            git reset -q --hard origin/main
            sleep $((i * 5))
          done
          echo "::error::gitops 레포에 푸시하지 못했습니다"; exit 1

  # 연기 시험(블로그 smoke.sh를 Argo CD 방식으로): Argo CD가 새 이미지를 띄울 때까지 바깥 주소를 두드려
  # 이번 커밋이 응답하는지 본다. 기다리는 동안 다른 서버의 gitops 갱신을 막지 않게 따로 돈다
  smoke:
    name: 연기 시험
    needs: [image, gitops]
    if: needs.gitops.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      result: ${{ steps.check.outputs.result }}
    steps:
      - name: 새 버전이 응답하는지 확인 (최대 12분)
        id: check
        env:
          BASE: ${{ vars.SMOKE_WEB_URL }}
          CHECK_PATH: "/version.txt"
        run: |
          if [ -z "$BASE" ]; then
            echo "::notice::변수 SMOKE_WEB_URL가 없어 연기 시험을 건너뜁니다(예: http://<클러스터 노드 외부 주소>:8315)."
            echo "result=skipped" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Argo CD 기본 동기화 주기(3분) + 롤아웃 시간을 기다린다. 응답에 이번 커밋 SHA가 보이면 성공
          for i in $(seq 1 72); do
            body=$(curl -fsS -m 5 "${BASE%/}${CHECK_PATH}" 2>/dev/null || true)
            if printf '%s' "$body" | grep -q "$GITHUB_SHA"; then
              echo "새 버전 확인: $body"; echo "result=ok" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep 10
          done
          echo "::error::12분 안에 새 버전(${GITHUB_SHA::7})이 ${BASE%/}${CHECK_PATH}에서 응답하지 않았습니다"
          echo "result=fail" >> "$GITHUB_OUTPUT"; exit 1

  # 자동 롤백(블로그 rollout.sh의 롤백을 Argo CD 방식으로): 방금 올린 gitops 커밋을 되돌리면 Argo CD가 직전 버전으로 맞춘다
  rollback:
    name: 자동 롤백
    needs: [gitops, smoke]
    if: failure() && needs.smoke.outputs.result == 'fail'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main
          path: gitops
      - name: gitops 커밋 되돌리기
        env:
          BUMP: ${{ needs.gitops.outputs.commit }}
        working-directory: gitops
        run: |
          git config user.name "trace-ci"
          git config user.email "trace-ci@users.noreply.github.com"
          for i in 1 2 3; do
            git pull --rebase -q origin main
            # 그사이 더 새 버전이 올라갔으면 그 배포의 연기 시험에 맡기고 되돌리지 않는다
            if ! grep -q "newTag: ${GITHUB_SHA}" overlays/school/kustomization.yaml; then
              echo "::notice::이미 다른 버전으로 바뀌어 되돌리지 않습니다"; exit 0
            fi
            git revert --no-edit "$BUMP"
            if git push -q origin HEAD:main; then echo "직전 버전으로 되돌렸습니다. Argo CD가 다시 맞춥니다."; exit 0; fi
            git reset -q --hard origin/main
            sleep $((i * 5))
          done
          echo "::error::롤백 커밋을 올리지 못했습니다. gitops 레포에서 직접 되돌려 주세요"; exit 1

  # 결과 알림 (Discord·텔레그램): 배포 완료·연기 시험 실패·롤백을 한 번에 알린다
  notify:
    name: 알림
    needs: [image, gitops, smoke, rollback]
    if: always() && needs.gitops.result != 'skipped' && (vars.DISCORD_ENABLED == 'true' || vars.TELEGRAM_ENABLED == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: 결과 정리
        id: sum
        env:
          GITOPS: ${{ needs.gitops.result }}
          SMOKE: ${{ needs.smoke.outputs.result }}
          ROLLBACK: ${{ needs.rollback.result }}
        run: |
          if [ "$GITOPS" != success ]; then t="gitops 갱신 실패"; st=failure
          elif [ "$SMOKE" = ok ]; then t="배포 완료 (연기 시험 통과)"; st=success
          elif [ "$SMOKE" = fail ] && [ "$ROLLBACK" = success ]; then t="연기 시험 실패 → 직전 버전으로 롤백"; st=failure
          elif [ "$SMOKE" = fail ]; then t="연기 시험 실패, 롤백도 실패 (확인 필요)"; st=failure
          else t="배포 요청됨 (연기 시험 건너뜀)"; st=success; fi
          echo "title=$t" >> "$GITHUB_OUTPUT"; echo "status=$st" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/notify
        with:
          discord-webhook-url: ${{ vars.DISCORD_ENABLED == 'true' && secrets.DISCORD_WEBHOOK_URL || '' }}
          telegram-bot-token: ${{ vars.TELEGRAM_ENABLED == 'true' && secrets.TELEGRAM_BOT_TOKEN || '' }}
          telegram-chat-id: ${{ vars.TELEGRAM_ENABLED == 'true' && secrets.TELEGRAM_CHAT_ID || '' }}
          title: "[${{ github.event.repository.name }}] ${{ steps.sum.outputs.title }}"
          description: "${{ github.sha }} → gitops overlays/school (Argo CD)"
          status: ${{ steps.sum.outputs.status }}
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
