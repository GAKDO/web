# CI가 끝나면 결과(통과·실패)를 Discord·텔레그램에 알린다. (블로그 ci-notify.yml을 옮김)
# 레포 변수 DISCORD_ENABLED·TELEGRAM_ENABLED 중 하나가 true일 때만 동작. 취소·건너뜀은 알리지 않는다.
name: CI 결과 알림

# 언제 도나: workflow_run = 아래 워크플로가 끝났다는 이벤트. 결과를 읽어 알림만 보내고 CI 결과는 바꾸지 않는다
on:
  workflow_run:
    workflows: [화면 CI, 배포, 비밀값 검사]
    types: [completed]

permissions:
  contents: read

jobs:
  notify:
    # 알림 줄이기: 실패는 언제나, 성공은 main·develop의 CI만 알린다.
    # 배포 결과는 배포 워크플로의 알림 작업이 따로 보내고, 비밀값 검사는 실패만 알린다.
    if: >-
      (vars.DISCORD_ENABLED == 'true' || vars.TELEGRAM_ENABLED == 'true') &&
      contains(fromJSON('["success", "failure", "timed_out"]'), github.event.workflow_run.conclusion) &&
      (github.event.workflow_run.conclusion != 'success' ||
      (contains(fromJSON('["main", "develop"]'), github.event.workflow_run.head_branch) &&
      !contains(fromJSON('["배포", "비밀값 검사"]'), github.event.workflow_run.name)))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/notify
        with:
          discord-webhook-url: ${{ vars.DISCORD_ENABLED == 'true' && secrets.DISCORD_WEBHOOK_URL || '' }}
          telegram-bot-token: ${{ vars.TELEGRAM_ENABLED == 'true' && secrets.TELEGRAM_BOT_TOKEN || '' }}
          telegram-chat-id: ${{ vars.TELEGRAM_ENABLED == 'true' && secrets.TELEGRAM_CHAT_ID || '' }}
          title: "[${{ github.event.repository.name }}] ${{ github.event.workflow_run.name }} ${{ github.event.workflow_run.conclusion == 'success' && '통과' || '실패' }}"
          description: "${{ github.event.workflow_run.head_branch }} · ${{ github.event.workflow_run.display_title }} · ${{ github.event.workflow_run.actor.login }}"
          status: ${{ github.event.workflow_run.conclusion == 'success' && 'success' || 'failure' }}
          url: ${{ github.event.workflow_run.html_url }}
