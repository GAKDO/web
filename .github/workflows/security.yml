# 비밀값이 커밋에 섞이지 않았는지 검사한다(NFR-03 "gitleaks 통과").
# 블로그 check-no-secrets.sh(학교 공용 비밀번호 패턴·비밀 파일)와 gitleaks(토큰·키 패턴 전반)를 함께 돌린다.
name: 비밀값 검사

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.28.0"

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # gitleaks가 커밋 이력 전체를 본다
      - name: 비밀 파일·학교 공용 비밀번호 패턴
        run: bash scripts/check-no-secrets.sh
      # gitleaks-action은 조직 레포에서 유료 라이선스를 요구해서, 같은 엔진(CLI)을 직접 받아 돌린다
      - name: gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner -v .
