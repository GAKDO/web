components:
  securitySchemes:
    bearerJwt:
      $ref: './components/common.yaml#/components/securitySchemes/bearerJwt'
  parameters:
    RentalId:
      name: rentalId
      in: path
      required: true
      schema:
        $ref: './components/common.yaml#/components/schemas/PublicId'
  schemas:
    ModelCode:
      type: string
      pattern: '^[A-Z0-9][A-Z0-9-]{1,63}$'
      examples: [MBA13-M2]
    RentalCreateRequest:
      type: object
      additionalProperties: false
      required: [deviceId, renterRef]
      properties:
        deviceId:
          $ref: './components/common.yaml#/components/schemas/PublicId'
        renterRef:
          type: string
          minLength: 1
          maxLength: 128
          description: 이름 대신 쓰는 내부 참조 번호
    Checkpoint:
      type: object
      required: [checkpointId, type, status, occurredAt]
      properties:
        checkpointId:
          $ref: './components/common.yaml#/components/schemas/PublicId'
        type:
          $ref: './components/codes.gen.yaml#/components/schemas/RentalCheckpointType'
        status:
          $ref: './components/codes.gen.yaml#/components/schemas/RentalCheckpointStatus'
        occurredAt:
          description: 촬영이 끝난 시각, 아직이면 null
          oneOf:
            - $ref: './components/common.yaml#/components/schemas/DateTime'
            - type: 'null'
    CheckpointCreateRequest:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          $ref: './components/codes.gen.yaml#/components/schemas/RentalCheckpointType'
    Rental:
      type: object
      required: [rentalId, deviceId, renterRef, status, startedAt, endedAt, createdAt, checkpoints]
      properties:
        rentalId:
          $ref: './components/common.yaml#/components/schemas/PublicId'
        deviceId:
          $ref: './components/common.yaml#/components/schemas/PublicId'
        serial:
          type: string
          description: 기기 시리얼. 1.0.x에 더한 선택 필드지만 rental-server는 항상 보낸다(화면이 기기를 따로 부르지 않게).
        renterRef:
          type: string
        status:
          $ref: './components/codes.gen.yaml#/components/schemas/RentalStatus'
        startedAt:
          oneOf:
            - $ref: './components/common.yaml#/components/schemas/DateTime'
            - type: 'null'
        endedAt:
          oneOf:
            - $ref: './components/common.yaml#/components/schemas/DateTime'
            - type: 'null'
        createdAt:
          $ref: './components/common.yaml#/components/schemas/DateTime'
        checkpoints:
          type: array
          description: 시작된 시점(OUT·RCV·RET 순)
          maxItems: 3
          items:
            $ref: '#/components/schemas/Checkpoint'
    RentalSummary:
      type: object
      required: [rentalId, deviceId, serial, modelCode, status, createdAt]
      properties:
        rentalId:
          $ref: './components/common.yaml#/components/schemas/PublicId'
        deviceId:
          $ref: './components/common.yaml#/components/schemas/PublicId'
        serial:
          type: string
        modelCode:
          $ref: '#/components/schemas/ModelCode'
        status:
          $ref: './components/codes.gen.yaml#/components/schemas/RentalStatus'
        createdAt:
          $ref: './components/common.yaml#/components/schemas/DateTime'
        renterRef:
          description: 대여자 참조(렌탈 생성 때 받은 값). 1.0.x에 더한 선택 필드(11/6, 기기별 이력)지만 rental-server는 항상 보낸다.
          type: string
        startedAt:
          description: 출고 시점을 시작한 때. 아직이면 null. 선택 필드(11/6), rental-server는 항상 보낸다.
          oneOf:
            - $ref: './components/common.yaml#/components/schemas/DateTime'
            - type: 'null'
        endedAt:
          description: 렌탈을 종료(CLOSED)한 때. 아직이면 null. 선택 필드(11/6), rental-server는 항상 보낸다.
          oneOf:
            - $ref: './components/common.yaml#/components/schemas/DateTime'
            - type: 'null'
        currentCheckpoint:
          description: |
            지금 시점 = 시작된 시점 중 가장 뒤(OUT → RCV → RET). 아직 시작한 시점이 없으면 null.
            1.0.x에 더한 선택 필드지만 rental-server는 항상 보낸다(값이 없으면 null).
          oneOf:
            - $ref: '#/components/schemas/Checkpoint'
            - type: 'null'
    RentalPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RentalSummary'
        nextCursor:
          type: [string, 'null']
    BoothCodeResponse:
      type: object
      required: [code, expiresAt, checkpointId, checkpointType]
      properties:
        code:
          $ref: '#/components/schemas/BoothCode'
        expiresAt:
          $ref: './components/common.yaml#/components/schemas/DateTime'
        checkpointId:
          $ref: './components/common.yaml#/components/schemas/PublicId'
        checkpointType:
          $ref: './components/codes.gen.yaml#/components/schemas/RentalCheckpointType'
    BoothCode:
      type: string
      pattern: '^[0-9]{6}$'
      description: 부스 코드 6자리 숫자
    BoothCodeRedeemRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          $ref: '#/components/schemas/BoothCode'
    BoothCodeTarget:
      type: object
      required: [rentalId, deviceId, serial, modelCode, checkpointId, checkpointType]
      properties:
        rentalId:
          $ref: './components/common.yaml#/components/schemas/PublicId'
        deviceId:
          $ref: './components/common.yaml#/components/schemas/PublicId'
        serial:
          type: string
        modelCode:
          $ref: '#/components/schemas/ModelCode'
        checkpointId:
          $ref: './components/common.yaml#/components/schemas/PublicId'
        checkpointType:
          $ref: './components/codes.gen.yaml#/components/schemas/RentalCheckpointType'
    DeviceCreateRequest:
      type: object
      additionalProperties: false
      required: [serial, modelCode, os]
      properties:
        serial:
          type: string
          minLength: 1
          maxLength: 64
        modelCode:
          $ref: '#/components/schemas/ModelCode'
        os:
          $ref: './components/codes.gen.yaml#/components/schemas/DeviceOs'
        color:
          type: string
          maxLength: 32
        assetNo:
          type: string
          maxLength: 64
    DeviceUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: serial·modelCode는 바꿀 수 없어 보내면 400.
      properties:
        color:
          type: [string, 'null']
          maxLength: 32
        assetNo:
          type: [string, 'null']
          maxLength: 64
        os:
          $ref: './components/codes.gen.yaml#/components/schemas/DeviceOs'
        status:
          $ref: './components/codes.gen.yaml#/components/schemas/DeviceStatus'
    Device:
      type: object
      required: [deviceId, serial, modelCode, modelName, os, color, assetNo, status, retiredAt, createdAt, updatedAt]
      properties:
        deviceId:
          $ref: './components/common.yaml#/components/schemas/PublicId'
        serial:
          type: string
        modelCode:
          $ref: '#/components/schemas/ModelCode'
        modelName:
          type: string
        os:
          $ref: './components/codes.gen.yaml#/components/schemas/DeviceOs'
        color:
          type: [string, 'null']
        assetNo:
          type: [string, 'null']
        status:
          $ref: './components/codes.gen.yaml#/components/schemas/DeviceStatus'
        retiredAt:
          oneOf:
            - $ref: './components/common.yaml#/components/schemas/DateTime'
            - type: 'null'
        createdAt:
          $ref: './components/common.yaml#/components/schemas/DateTime'
        updatedAt:
          $ref: './components/common.yaml#/components/schemas/DateTime'
    DevicePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Device'
        nextCursor:
          type: [string, 'null']
    CatalogDeviceList:
      type: object
      required: [items]
      description: 공개 보유 기기 목록(listCatalogDevices). 쪽 나눔 없이 최대 200대
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/CatalogDevice'
    CatalogDevice:
      type: object
      additionalProperties: false
      required: [deviceId, modelCode, modelName, manufacturer, os, color, status, available, rentalCount, spec, dimensions, checkpoints]
      description: 공개 기기 한 대. 시리얼·자산번호·대여자는 없다
      properties:
        deviceId:
          $ref: './components/common.yaml#/components/schemas/PublicId'
        modelCode:
          $ref: '#/components/schemas/ModelCode'
        modelName:
          type: string
        manufacturer:
          type: [string, 'null']
        os:
          $ref: './components/codes.gen.yaml#/components/schemas/DeviceOs'
        color:
          type: [string, 'null']
        status:
          $ref: './components/codes.gen.yaml#/components/schemas/DeviceStatus'
        available:
          type: boolean
          description: 지금 빌릴 수 있는지. 상태가 ACTIVE이고 진행 중(OPEN) 렌탈이 없으면 true
        rentalCount:
          type: integer
          minimum: 0
          description: 이 기기의 렌탈 수(진행 중 포함)
        spec:
          description: 기종 기준 사양. 없으면 null
          oneOf:
            - $ref: '#/components/schemas/ModelSpec'
            - type: 'null'
        dimensions:
          $ref: '#/components/schemas/ModelDimensions'
        checkpoints:
          type: array
          maxItems: 12
          description: >-
            검사가 끝난 시점(GRADED·SEALED), 최근 것부터 최대 12개. 화면은 앞에서부터 흠집·진단이 있는 첫 시점을 그 기기의 최신 상태로 쓴다. 화면은 이 ID를 100개씩 나눠 capture·diagnostics 공개 목록에 묻는다(최악 200대×12개면 각 24회). 세 공개 목록 경로는 게이트웨이에서 같은 catalog 버킷으로 IP당 합산 분당 300회까지다
          items:
            $ref: '#/components/schemas/CatalogCheckpoint'
    CatalogCheckpoint:
      type: object
      additionalProperties: false
      required: [checkpointId, type, status, occurredAt]
      properties:
        checkpointId:
          $ref: './components/common.yaml#/components/schemas/PublicId'
        type:
          $ref: './components/codes.gen.yaml#/components/schemas/RentalCheckpointType'
        status:
          $ref: './components/codes.gen.yaml#/components/schemas/RentalCheckpointStatus'
        occurredAt:
          oneOf:
            - $ref: './components/common.yaml#/components/schemas/DateTime'
            - type: 'null'
    DeviceModelSummary:
      type: object
      required: [modelCode, name, manufacturer, formFactor]
      properties:
        modelCode:
          $ref: '#/components/schemas/ModelCode'
        name:
          type: string
        manufacturer:
          type: [string, 'null']
        formFactor:
          $ref: './components/codes.gen.yaml#/components/schemas/DeviceFormFactor'
        spec:
          description: 기준 사양(선택 필드, 1.0.0 뒤 추가). 목록에서 기준 사양을 한눈에 보려고 넣는다. 서버는 언제나 보내고, 사양이 없는 기종은 null
          oneOf:
            - $ref: '#/components/schemas/ModelSpec'
            - type: 'null'
    ModelSpec:
      type: object
      description: 기준 사양(진단 비교용)
      properties:
        cpu:
          type: string
        ramGb:
          type: integer
          minimum: 1
        ssdGb:
          type: integer
          minimum: 1
        gpu:
          type: string
          maxLength: 128
          description: 그래픽(선택). 외장 GPU가 있는 Windows 노트북 등, 예 "NVIDIA GeForce RTX 4060 Laptop". 내장 그래픽만 있으면 비워 둔다
    ModelDimensions:
      type: object
      description: 3D 트윈 치수(mm)
      required: [widthMm, depthMm, baseHMm, lidHMm]
      properties:
        widthMm:
          type: number
          exclusiveMinimum: 0
          maximum: 1000
        depthMm:
          type: number
          exclusiveMinimum: 0
          maximum: 1000
        baseHMm:
          type: number
          exclusiveMinimum: 0
          maximum: 100
        lidHMm:
          type: number
          exclusiveMinimum: 0
          maximum: 100
    DeviceModel:
      type: object
      required: [modelCode, name, manufacturer, formFactor, spec, dimensions, updatedAt]
      properties:
        modelCode:
          $ref: '#/components/schemas/ModelCode'
        name:
          type: string
        manufacturer:
          type: [string, 'null']
        formFactor:
          $ref: './components/codes.gen.yaml#/components/schemas/DeviceFormFactor'
        spec:
          oneOf:
            - $ref: '#/components/schemas/ModelSpec'
            - type: 'null'
        dimensions:
          $ref: '#/components/schemas/ModelDimensions'
        updatedAt:
          $ref: './components/common.yaml#/components/schemas/DateTime'
    DeviceModelUpsertRequest:
      type: object
      additionalProperties: false
      required: [name, formFactor, dimensions]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        manufacturer:
          type: string
          maxLength: 64
        formFactor:
          $ref: './components/codes.gen.yaml#/components/schemas/DeviceFormFactor'
        spec:
          $ref: '#/components/schemas/ModelSpec'
        dimensions:
          $ref: '#/components/schemas/ModelDimensions'
    PilotParticipantCreateRequest:
      type: object
      additionalProperties: false
      required: [alias, deviceId, consentAt]
      properties:
        alias:
          type: string
          pattern: '^P\d{2,3}$'
        deviceId:
          $ref: './components/common.yaml#/components/schemas/PublicId'
        consentAt:
          $ref: './components/common.yaml#/components/schemas/DateTime'
    PilotParticipant:
      type: object
      required: [participantId, alias, deviceId, consentAt, createdAt]
      properties:
        participantId:
          $ref: './components/common.yaml#/components/schemas/PublicId'
        alias:
          type: string
        deviceId:
          $ref: './components/common.yaml#/components/schemas/PublicId'
        consentAt:
          $ref: './components/common.yaml#/components/schemas/DateTime'
        createdAt:
          $ref: './components/common.yaml#/components/schemas/DateTime'
