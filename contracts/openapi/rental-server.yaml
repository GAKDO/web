openapi: 3.1.0
info:
  title: TRACE rental-server
  version: 1.0.0
  description: |
    렌탈·시점·기기·기종·파일럿. 원본은 GAKDO/docs design/rest-api-v0.md "rental-server" 표.

    - 오류는 모두 `application/problem+json`(Problem, `code`는 codes.yaml `error_code`).
    - `x-trace-access`: roles(codes.yaml `auth.token_role`), scope(NONE·OWN_RENTAL·CHECKPOINT·BOOTH), captureToken.
    - `x-trace-error-codes`: 그 응답이 낼 수 있는 `code` 값.
    - 목록은 커서 방식(`limit`, `cursor` → `items`, `nextCursor`). `GET /devices`도 같다(원본의 page에서 바꿈).
servers:
  - url: https://{gateway}
    description: gateway(8314) 뒤
    variables:
      gateway:
        default: localhost:8314
tags:
  - name: 렌탈
    description: 렌탈과 세 시점(OUT·RCV·RET)
  - name: 기기
    description: 기기 등록·검색·상태
  - name: 기종
    description: 기종과 3D 트윈 치수
  - name: 파일럿
    description: 파일럿 참여자 별칭
  - name: 운영
    description: ping
paths:
  /api/v1/rentals/ping:
    get:
      tags: [운영]
      operationId: rentalPing
      summary: 배포 확인
      description: 로그인 없이 연다.
      security: []
      responses:
        '200':
          description: 정상
          content:
            application/json:
              schema:
                $ref: './components/common.yaml#/components/schemas/PingResponse'
              example:
                service: rental-server
                version: 0.1.0
                commit: fd69858
  /api/v1/rentals:
    post:
      tags: [렌탈]
      operationId: createRental
      summary: 렌탈 생성
      description: |
        ACTIVE 기기로만 만들 수 있고, 같은 기기에 진행 중(OPEN) 렌탈은 하나만. 생성되면 상태 OPEN. (FR-RNT-01)
        수리 중(MAINTENANCE)·폐기(RETIRED) 기기면 409 DEVICE_NOT_ACTIVE.
      security:
        - bearerJwt: []
      x-trace-requirements: [FR-RNT-01]
      x-trace-access:
        roles: [ADMIN]
        scope: NONE
        captureToken: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentalCreateRequest'
            example:
              deviceId: aAXQFO2Vz6ZTFbPctC2dq
              renterRef: R-2026-0012
      responses:
        '201':
          description: 생성됨
          headers:
            Location:
              description: /api/v1/rentals/{rentalId}
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rental'
              example:
                rentalId: Ws0HLv6QRbDILPWOcz5I2
                deviceId: aAXQFO2Vz6ZTFbPctC2dq
                serial: C02EXAMPLE01
                renterRef: R-2026-0012
                status: OPEN
                startedAt: null
                endedAt: null
                createdAt: '2026-11-12T08:50:00+09:00'
                checkpoints: []
        '400':
          $ref: './components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components/common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './components/common.yaml#/components/responses/NotFound'
        '409':
          description: 진행 중 렌탈이 있음 또는 기기가 ACTIVE 아님
          x-trace-error-codes: [RENTAL_OPEN_EXISTS, DEVICE_NOT_ACTIVE]
          content:
            application/problem+json:
              schema:
                $ref: './components/common.yaml#/components/schemas/Problem'
              examples:
                openExists:
                  summary: 같은 기기로 진행 중인 렌탈 있음
                  value:
                    title: 진행 중인 렌탈이 있습니다
                    status: 409
                    code: RENTAL_OPEN_EXISTS
                    detail: 같은 기기로 진행 중인 렌탈은 하나만 만들 수 있습니다.
                    instance: /api/v1/rentals
                deviceNotActive:
                  summary: 수리 중·폐기 기기
                  value:
                    title: 렌탈할 수 없는 기기입니다
                    status: 409
                    code: DEVICE_NOT_ACTIVE
                    detail: 수리 중이거나 폐기된 기기는 렌탈을 만들 수 없습니다.
                    instance: /api/v1/rentals
    get:
      tags: [렌탈]
      operationId: listRentals
      summary: 렌탈 목록
      description: >-
        ADMIN은 전체, CUSTOMER는 rentals 클레임에 있는 내 렌탈만 보인다. 최근 생성 순. 항목마다 지금 시점(currentCheckpoint)을 준다. (FR-USR-03)
        BOOTH(11/3 추가)는 부스 태블릿의 "검사 기다리는 기기" 목록용으로 진행 중(OPEN) 렌탈만 보인다. status를 무엇으로 보내든 OPEN으로 거른다.
        부스는 currentCheckpoint가 OPEN인 항목을 고르고 그 checkpointId로 세트를 만든다(빌린 노트북이라 스티커·QR 없이 목록에서 탭).
        deviceId(11/6 추가)를 주면 그 기기의 렌탈만 보인다(기기별 렌탈 이력). 없는 기기 ID면 빈 목록. 역할별 거르기(CUSTOMER 클레임·BOOTH OPEN)는 그대로 겹쳐 적용한다.
      security:
        - bearerJwt: []
      x-trace-requirements: [FR-USR-03, FR-CAP-01]
      x-trace-access:
        roles: [ADMIN, CUSTOMER, BOOTH]
        scope: NONE
        captureToken: false
        note: CUSTOMER는 결과를 rentals 클레임으로 거르고, BOOTH는 OPEN 렌탈만 본다
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: './components/codes.gen.yaml#/components/schemas/RentalStatus'
        - name: deviceId
          in: query
          required: false
          description: 이 기기의 렌탈만(기기별 렌탈 이력, 11/6 추가)
          schema:
            $ref: './components/common.yaml#/components/schemas/PublicId'
        - $ref: './components/common.yaml#/components/parameters/Limit'
        - $ref: './components/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalPage'
              example:
                items:
                  - rentalId: Ws0HLv6QRbDILPWOcz5I2
                    deviceId: aAXQFO2Vz6ZTFbPctC2dq
                    serial: C02EXAMPLE01
                    modelCode: MBA13-M2
                    renterRef: R-2026-0012
                    status: OPEN
                    startedAt: '2026-11-12T09:00:00+09:00'
                    endedAt: null
                    createdAt: '2026-11-12T08:50:00+09:00'
                    currentCheckpoint:
                      checkpointId: h40b9AN9xMQhXRHrOyJWB
                      type: RCV
                      status: OPEN
                      occurredAt: null
                nextCursor: null
        '400':
          $ref: './components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components/common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components/common.yaml#/components/responses/Forbidden'
  /api/v1/rentals/{rentalId}:
    parameters:
      - $ref: '#/components/parameters/RentalId'
    get:
      tags: [렌탈]
      operationId: getRental
      summary: 렌탈과 세 시점 상태
      description: CUSTOMER는 본인 렌탈만(아니면 403 OUT_OF_SCOPE). (FR-RNT-02)
      security:
        - bearerJwt: []
      x-trace-requirements: [FR-RNT-02]
      x-trace-access:
        roles: [ADMIN, CUSTOMER]
        scope: OWN_RENTAL
        captureToken: false
      responses:
        '200':
          description: 렌탈
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rental'
              example:
                rentalId: Ws0HLv6QRbDILPWOcz5I2
                deviceId: aAXQFO2Vz6ZTFbPctC2dq
                serial: C02EXAMPLE01
                renterRef: R-2026-0012
                status: OPEN
                startedAt: '2026-11-12T09:00:00+09:00'
                endedAt: null
                createdAt: '2026-11-12T08:50:00+09:00'
                checkpoints:
                  - checkpointId: aJ3bYet82WYF8iVlHstT2
                    type: OUT
                    status: SEALED
                    occurredAt: '2026-11-12T09:00:00+09:00'
                  - checkpointId: h40b9AN9xMQhXRHrOyJWB
                    type: RCV
                    status: OPEN
                    occurredAt: null
        '401':
          $ref: './components/common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './components/common.yaml#/components/responses/NotFound'
    delete:
      tags: [렌탈]
      operationId: deleteTestRental
      summary: 시험 렌탈 지우기
      description: >-
        시험 데이터 전용. 기기 시리얼이 `TEST-`로 시작하는 렌탈만 지운다(아니면 409 NOT_TEST_DATA). 렌탈 상태와 관계없이
        렌탈·시점을 지우고, 그 기기에 남은 렌탈·파일럿 참가가 없으면 기기도 지운다(같은 시리얼로 다시 등록할 수 있게).
        시점마다 trace.checkpoint.purged를 내서 capture-server(세트·사진·흠집·등급)·report-server(기록 체인·리포트)·
        diagnostics-server(진단)가 자기 데이터를 지운다. 실제 렌탈 기록(봉인된 증거)은 지울 수 없다. (11/4 민서 요청)
      security:
        - bearerJwt: []
      x-trace-requirements: [FR-RNT-02]
      x-trace-access:
        roles: [ADMIN]
        scope: NONE
        captureToken: false
      responses:
        '204':
          description: 지움
        '401':
          $ref: './components/common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './components/common.yaml#/components/responses/NotFound'
        '409':
          description: 시험 데이터가 아님
          x-trace-error-codes: [NOT_TEST_DATA]
          content:
            application/problem+json:
              schema:
                $ref: './components/common.yaml#/components/schemas/Problem'
              example:
                title: 시험 데이터만 지울 수 있습니다
                status: 409
                code: NOT_TEST_DATA
                detail: 기기 시리얼이 TEST-로 시작하는 렌탈만 지울 수 있습니다.
  /api/v1/rentals/{rentalId}/checkpoints:
    parameters:
      - $ref: '#/components/parameters/RentalId'
    post:
      tags: [렌탈]
      operationId: startCheckpoint
      summary: 시점 시작
      description: |
        OUT → RCV → RET 순서로 하나씩만. 순서를 어기거나 같은 시점이 이미 있으면 409 CHECKPOINT_ORDER_VIOLATION.
        OUT을 시작하면 렌탈 startedAt이 채워진다. (FR-RNT-02)
      security:
        - bearerJwt: []
      x-trace-requirements: [FR-RNT-02]
      x-trace-access:
        roles: [ADMIN]
        scope: NONE
        captureToken: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckpointCreateRequest'
            example:
              type: RCV
      responses:
        '201':
          description: 시작됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkpoint'
              example:
                checkpointId: h40b9AN9xMQhXRHrOyJWB
                type: RCV
                status: OPEN
                occurredAt: null
        '400':
          $ref: './components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components/common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './components/common.yaml#/components/responses/NotFound'
        '409':
          description: 순서 위반
          x-trace-error-codes: [CHECKPOINT_ORDER_VIOLATION]
          content:
            application/problem+json:
              schema:
                $ref: './components/common.yaml#/components/schemas/Problem'
              example:
                title: 시점 순서가 맞지 않습니다
                status: 409
                code: CHECKPOINT_ORDER_VIOLATION
                detail: 출고(OUT)가 봉인된 뒤에 수령(RCV)을 시작할 수 있습니다.
  /api/v1/rentals/{rentalId}/booth-code:
    parameters:
      - $ref: '#/components/parameters/RentalId'
    post:
      tags: [렌탈]
      operationId: issueBoothCode
      summary: 부스 코드 발급
      description: |
        부스 태블릿에 넣을 6자리 숫자 코드. 부스가 코드를 넣으면 기기·렌탈·시점 ID가 채워져 21자 ID 세 개를 손으로 옮기지 않는다(11/4 민서 요청).
        - 코드는 렌탈의 지금 시점(시작된 시점 중 가장 뒤)에 묶이고, 그 시점이 아직 안 찍힌(OPEN) 상태여야 한다. 없으면 409 CHECKPOINT_ORDER_VIOLATION.
        - 진행 중(OPEN) 렌탈만. 10분 동안 한 번만 쓸 수 있고, 서버는 SHA-256 해시만 저장한다.
        - 같은 렌탈에 다시 발급하면 앞서 발급한 안 쓴 코드는 바로 못 쓴다.
      security:
        - bearerJwt: []
      x-trace-requirements: [FR-RNT-02]
      x-trace-access:
        roles: [ADMIN]
        scope: NONE
        captureToken: false
      responses:
        '201':
          description: 발급됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoothCodeResponse'
              example:
                code: '305718'
                expiresAt: '2026-11-12T09:10:00+09:00'
                checkpointId: aJ3bYet82WYF8iVlHstT2
                checkpointType: OUT
        '401':
          $ref: './components/common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './components/common.yaml#/components/responses/NotFound'
        '409':
          description: 진행 중 렌탈이 아니거나 찍을 시점이 없음
          x-trace-error-codes: [CHECKPOINT_ORDER_VIOLATION]
          content:
            application/problem+json:
              schema:
                $ref: './components/common.yaml#/components/schemas/Problem'
              example:
                title: 시점 순서가 맞지 않습니다
                status: 409
                code: CHECKPOINT_ORDER_VIOLATION
                detail: 출고 시점을 먼저 시작하세요.
  /api/v1/rentals/booth-codes/redeem:
    post:
      tags: [렌탈]
      operationId: redeemBoothCode
      summary: 부스 코드 → 기기·렌탈·시점 ID
      description: |
        부스 태블릿이 6자리 코드를 넣어 촬영할 기기·렌탈·시점을 받는다. 코드는 한 번만 쓸 수 있다(성공하면 바로 못 씀).
        - 만료(10분)·이미 사용·같은 렌탈에 다시 발급해 무효가 됨·그 사이 시점이 찍혀 OPEN이 아니면 410 BOOTH_CODE_EXPIRED.
          발급한 적 없는 코드만 400 BOOTH_CODE_INVALID(실패 한도에 셈).
        - 대입 공격 방지: 모든 부스를 합쳐 틀린 코드가 1분에 30번을 넘으면 다음 1분 동안 429 RATE_LIMITED(Retry-After).
      security:
        - bearerJwt: []
      x-trace-requirements: [FR-RNT-02]
      x-trace-access:
        roles: [BOOTH]
        scope: NONE
        captureToken: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoothCodeRedeemRequest'
            example:
              code: '305718'
      responses:
        '200':
          description: 코드가 맞음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoothCodeTarget'
              example:
                rentalId: Ws0HLv6QRbDILPWOcz5I2
                deviceId: aAXQFO2Vz6ZTFbPctC2dq
                serial: C02XG2JHJGH5
                modelCode: MBA13-M2
                checkpointId: aJ3bYet82WYF8iVlHstT2
                checkpointType: OUT
        '400':
          description: 코드 틀림 또는 형식 오류
          x-trace-error-codes: [VALIDATION_FAILED, BOOTH_CODE_INVALID]
          content:
            application/problem+json:
              schema:
                $ref: './components/common.yaml#/components/schemas/Problem'
              example:
                title: 부스 코드가 맞지 않습니다
                status: 400
                code: BOOTH_CODE_INVALID
        '401':
          $ref: './components/common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components/common.yaml#/components/responses/Forbidden'
        '410':
          description: 코드 만료·이미 사용됨·다시 발급해 무효·시점이 이미 찍힘
          x-trace-error-codes: [BOOTH_CODE_EXPIRED]
          content:
            application/problem+json:
              schema:
                $ref: './components/common.yaml#/components/schemas/Problem'
              example:
                title: 부스 코드가 만료되었습니다
                status: 410
                code: BOOTH_CODE_EXPIRED
        '429':
          description: 요청 제한 초과 (모든 부스를 합쳐 틀린 코드 분당 30회, 넘으면 1분 차단, RATE_LIMITED)
          headers:
            Retry-After:
              description: 다시 시도할 수 있을 때까지 초
              required: true
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: './components/common.yaml#/components/schemas/Problem'
              example:
                title: 요청이 너무 많습니다
                status: 429
                code: RATE_LIMITED
  /api/v1/rentals/{rentalId}/close:
    parameters:
      - $ref: '#/components/parameters/RentalId'
    post:
      tags: [렌탈]
      operationId: closeRental
      summary: 반납 후 종료
      description: 반납(RET) 시점이 봉인된 렌탈만 CLOSED로. 아니면 409 RENTAL_NOT_CLOSABLE. (FR-RNT-02)
      security:
        - bearerJwt: []
      x-trace-requirements: [FR-RNT-02]
      x-trace-access:
        roles: [ADMIN]
        scope: NONE
        captureToken: false
      responses:
        '204':
          description: 종료됨
        '401':
          $ref: './components/common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './components/common.yaml#/components/responses/NotFound'
        '409':
          description: 종료할 수 없는 상태
          x-trace-error-codes: [RENTAL_NOT_CLOSABLE]
          content:
            application/problem+json:
              schema:
                $ref: './components/common.yaml#/components/schemas/Problem'
              example:
                title: 아직 종료할 수 없는 렌탈입니다
                status: 409
                code: RENTAL_NOT_CLOSABLE
                detail: 반납 시점이 봉인된 뒤에 종료할 수 있습니다.
  /api/v1/devices:
    post:
      tags: [기기]
      operationId: createDevice
      summary: 기기 등록
      description: 시리얼과 기종으로 등록. 시리얼이 이미 있으면 409, 기종이 없으면 404. 상태는 ACTIVE로 시작. (FR-RNT-01)
      security:
        - bearerJwt: []
      x-trace-requirements: [FR-RNT-01]
      x-trace-access:
        roles: [ADMIN]
        scope: NONE
        captureToken: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreateRequest'
            example:
              serial: C02EXAMPLE01
              modelCode: MBA13-M2
              os: MACOS
              color: 미드나이트
              assetNo: A-0001
      responses:
        '201':
          description: 등록됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
              example:
                deviceId: aAXQFO2Vz6ZTFbPctC2dq
                serial: C02EXAMPLE01
                modelCode: MBA13-M2
                modelName: MacBook Air (M2, 2022)
                os: MACOS
                color: 미드나이트
                assetNo: A-0001
                status: ACTIVE
                retiredAt: null
                createdAt: '2026-11-10T10:00:00+09:00'
                updatedAt: '2026-11-10T10:00:00+09:00'
        '400':
          $ref: './components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components/common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './components/common.yaml#/components/responses/NotFound'
        '409':
          description: 시리얼 중복
          x-trace-error-codes: [DEVICE_SERIAL_EXISTS]
          content:
            application/problem+json:
              schema:
                $ref: './components/common.yaml#/components/schemas/Problem'
              example:
                title: 이미 등록된 시리얼입니다
                status: 409
                code: DEVICE_SERIAL_EXISTS
    get:
      tags: [기기]
      operationId: listDevices
      summary: 기기 목록·검색
      description: 기종·상태로 거르고 q로 시리얼·자산번호 일부를 찾는다. 최근 등록 순. (FR-RNT-05)
      security:
        - bearerJwt: []
      x-trace-requirements: [FR-RNT-05]
      x-trace-access:
        roles: [ADMIN]
        scope: NONE
        captureToken: false
      parameters:
        - name: modelCode
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ModelCode'
        - name: status
          in: query
          required: false
          schema:
            $ref: './components/codes.gen.yaml#/components/schemas/DeviceStatus'
        - name: q
          in: query
          required: false
          description: 시리얼·자산번호 일부(대소문자 무시)
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - $ref: './components/common.yaml#/components/parameters/Limit'
        - $ref: './components/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePage'
              example:
                items:
                  - deviceId: aAXQFO2Vz6ZTFbPctC2dq
                    serial: C02EXAMPLE01
                    modelCode: MBA13-M2
                    modelName: MacBook Air (M2, 2022)
                    os: MACOS
                    color: 미드나이트
                    assetNo: A-0001
                    status: MAINTENANCE
                    retiredAt: null
                    createdAt: '2026-11-10T10:00:00+09:00'
                    updatedAt: '2026-11-11T15:00:00+09:00'
                nextCursor: eyJpZCI6IjAxOTNhMWMyIn0
        '400':
          $ref: './components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components/common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components/common.yaml#/components/responses/Forbidden'
  /api/v1/catalog/devices:
    get:
      tags: [기기]
      operationId: listCatalogDevices
      summary: 공개 보유 기기 목록
      description: >-
        로그인 없이 회사가 가진 기기를 본다(11/8 민서 요청, 고객이 흠집·진단·벤치마크를 비교해 고르기 위해).
        폐기(RETIRED)는 빼고 최근 등록 순으로 최대 200대. 시리얼·자산번호·대여자·렌탈 ID는 싣지 않는다.
        흠집·등급은 capture-server `GET /api/v1/captures/catalog`, 진단은 diagnostics-server `GET /api/v1/diagnostics/catalog`에
        `checkpoints`의 checkpointId를 넘겨 읽는다(서비스끼리 REST를 부르지 않으므로 화면이 모은다).
      security: []
      x-trace-requirements: [FR-RNT-05]
      responses:
        '200':
          description: 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogDeviceList'
              example:
                items:
                  - deviceId: aAXQFO2Vz6ZTFbPctC2dq
                    modelCode: MBA13-M2
                    modelName: MacBook Air (M2, 2022)
                    manufacturer: Apple
                    os: MACOS
                    color: 미드나이트
                    status: ACTIVE
                    available: true
                    rentalCount: 3
                    spec:
                      cpu: Apple M2
                      ramGb: 16
                      ssdGb: 256
                    dimensions:
                      widthMm: 304.1
                      depthMm: 215
                      baseHMm: 6
                      lidHMm: 5.3
                    checkpoints:
                      - checkpointId: Q2xxYv8oP0aLkM3nB7cDe
                        type: RET
                        status: SEALED
                        occurredAt: '2026-11-12T18:00:00+09:00'
                      - checkpointId: Kp9sT1uVw2Xy3Za4Bc5De
                        type: OUT
                        status: SEALED
                        occurredAt: '2026-11-12T09:00:00+09:00'
        '429':
          $ref: './components/common.yaml#/components/responses/TooManyRequests'
  /api/v1/devices/{deviceId}:
    parameters:
      - name: deviceId
        in: path
        required: true
        schema:
          $ref: './components/common.yaml#/components/schemas/PublicId'
    get:
      tags: [기기]
      operationId: getDevice
      summary: 기기 상세
      description: |
        기기 하나. 기기별 렌탈 이력 화면의 머리글용(11/6 추가). 이력은 `GET /api/v1/rentals?deviceId=`로 읽는다.
        없는 기기면 404. (FR-RNT-05)
      security:
        - bearerJwt: []
      x-trace-requirements: [FR-RNT-05]
      x-trace-access:
        roles: [ADMIN]
        scope: NONE
        captureToken: false
      responses:
        '200':
          description: 기기
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
              example:
                deviceId: aAXQFO2Vz6ZTFbPctC2dq
                serial: C02EXAMPLE01
                modelCode: MBA13-M2
                modelName: MacBook Air (M2, 2022)
                os: MACOS
                color: 미드나이트
                assetNo: A-0001
                status: ACTIVE
                retiredAt: null
                createdAt: '2026-11-10T10:00:00+09:00'
                updatedAt: '2026-11-10T10:00:00+09:00'
        '401':
          $ref: './components/common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './components/common.yaml#/components/responses/NotFound'
    patch:
      tags: [기기]
      operationId: updateDevice
      summary: 기기 수정
      description: |
        색상·자산번호·OS·상태만 바꾼다. 시리얼·기종은 못 바꿔서 보내면 400. RETIRED로 바꾸면 retiredAt이 채워진다.
        진행 중 렌탈이 있는데 MAINTENANCE·RETIRED로 바꾸면 409 DEVICE_HAS_OPEN_RENTAL.
        폐기(RETIRED) 기기는 수리 중(MAINTENANCE)으로만 되돌린다. RETIRED → ACTIVE는 409 DEVICE_STATUS_TRANSITION_INVALID
        (점검을 거쳐 MAINTENANCE → ACTIVE). 되돌리면 retiredAt은 비운다. (FR-RNT-05, 11/2 결정)
      security:
        - bearerJwt: []
      x-trace-requirements: [FR-RNT-05]
      x-trace-access:
        roles: [ADMIN]
        scope: NONE
        captureToken: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceUpdateRequest'
            example:
              status: MAINTENANCE
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
              example:
                deviceId: aAXQFO2Vz6ZTFbPctC2dq
                serial: C02EXAMPLE01
                modelCode: MBA13-M2
                modelName: MacBook Air (M2, 2022)
                os: MACOS
                color: 미드나이트
                assetNo: A-0001
                status: MAINTENANCE
                retiredAt: null
                createdAt: '2026-11-10T10:00:00+09:00'
                updatedAt: '2026-11-11T15:00:00+09:00'
        '400':
          $ref: './components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './components/common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './components/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './components/common.yaml#/components/responses/NotFound'
        '409':
          description: 진행 중 렌탈이 있는데 수리 중·폐기로 바꿈, 또는 폐기 기기를 사용 가능으로 바로 바꿈
          x-trace-error-codes: [DEVICE_HAS_OPEN_RENTAL, DEVICE_STATUS_TRANSITION_INVALID]
          content:
            application/problem+json:
              schema:
                $ref: './components/common.yaml#/components/schemas/Problem'
              examples:
                openRental:
                  summary: 진행 중 렌탈이 있음
                  value:
                    title: 진행 중인 렌탈이 있는 기기입니다
                    status: 409
                    code: DEVICE_HAS_OPEN_RENTAL
                    detail: 렌탈을 종료한 뒤에 수리 중이나 폐기로 바꿀 수 있습니다.
                retiredToActive:
                  summary: 폐기 기기를 바로 사용 가능으로
                  value:
                    title: 폐기한 기기는 수리 중으로만 되돌릴 수 있습니다
                    status: 409
                    code: DEVICE_STATUS_TRANSITION_INVALID
                    detail: 수리 중으로 바꿔 점검한 뒤 사용 가능으로 바꿔 주세요.
  /api/v1/device-models:
    get:
      tags: [기종]
      operationId: listDeviceModels
      summary: 기종 목록
      description: 기기 등록 화면의 선택 목록이자 관리자 기종 목록. 기종 수가 적어 페이지 없이 전부 주고, 정렬·검색은 화면에서 한다. 항목마다 기준 사양 `spec`을 함께 준다. (FR-RNT-03)
      security:
