# 서버 OpenAPI 5개가 함께 쓰는 형식. 서버 파일에서 $ref: './components/common.yaml#/components/...'로 참조한다.
openapi: 3.1.0
info:
  title: TRACE 공통 형식
  version: 0.1.0
  description: Problem Details(+code), ID·시각 형식, 커서 목록 파라미터, 공통 오류 응답, 인증 방식.
paths: {}
components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        auth-server가 발급한 RS256 액세스 JWT. 클레임은 iss(trace), sub, role(codes.yaml auth.token_role),
        scope(checkpointId 또는 boothId), rentals(CUSTOMER가 볼 수 있는 렌탈 ID 목록), auth_time, iat, exp, jti.
        auth_time(초)은 ADMIN·CUSTOMER 일반 토큰에만 있는 실제 로그인 시각이고, 리프레시로 다시 받아도 바뀌지 않는다.
        gateway가 검증한 뒤 서버에는 X-User-Id·X-Role·X-Scope 헤더로 넘긴다.
    refreshCookie:
      type: apiKey
      in: cookie
      name: trace_refresh
      description: 리프레시 토큰(HttpOnly, Secure, SameSite=Strict, Path=/api/v1/auth). 7일, 쓰면 교체된다.
  schemas:
    PublicId:
      type: string
      pattern: '^[A-Za-z0-9_-]{21}$'
      description: NanoID 21자(DB 기본 키는 내보내지 않음)
      examples: [IPv6mcQOlTkKj6mOecAQt]
    DateTime:
      type: string
      format: date-time
      pattern: '(Z|[+-]\d{2}:\d{2})$'
      description: ISO 8601, 오프셋 필수. 저장은 UTC, 화면은 KST.
      examples: ['2026-11-12T09:00:00+09:00']
    Sha256:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: SHA-256 16진수 소문자 64자
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: camelCase 필드 경로 (예 photos[0].sha256)
        message:
          type: string
    Problem:
      type: object
      description: RFC 9457 Problem Details에 code를 더한 오류 본문. content type은 application/problem+json.
      required: [title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
          description: 사람이 읽는 짧은 제목(한국어)
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          description: 요청 경로
        code:
          $ref: './codes.gen.yaml#/components/schemas/ErrorCode'
        errors:
          type: array
          description: 400 VALIDATION_FAILED일 때 필드별 오류
          items:
            $ref: '#/components/schemas/FieldError'
        remainingAttempts:
          type: integer
          minimum: 0
          description: 400 CODE_INVALID일 때 남은 시도 횟수
        missingFaces:
          type: array
          description: 409 CAPTURE_FACES_MISSING일 때 빠진 필수 면
          items:
            $ref: './codes.gen.yaml#/components/schemas/CaptureFace'
    PingResponse:
      type: object
      required: [service, version, commit]
      properties:
        service:
          type: string
          examples: [rental-server]
        version:
          type: string
          examples: [0.1.0]
        commit:
          type: string
          description: 이미지에 구운 커밋 SHA
          examples: [fd69858]
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: 이전 응답의 nextCursor. 비우면 처음부터.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 같은 키로 다시 보내면 처음 응답을 그대로 돌려준다. 같은 키에 다른 본문이면 422 IDEMPOTENCY_KEY_CONFLICT.
      schema:
        type: string
        minLength: 8
        maxLength: 128
  responses:
    BadRequest:
      description: 형식 오류 (VALIDATION_FAILED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: 요청 형식이 올바르지 않습니다
            status: 400
            code: VALIDATION_FAILED
            errors:
              - field: email
                message: 이메일 형식이 아닙니다
    Unauthorized:
      description: 토큰 없음·만료 (UNAUTHENTICATED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: 로그인이 필요합니다
            status: 401
            code: UNAUTHENTICATED
    Forbidden:
      description: 역할 없음(FORBIDDEN) 또는 범위 밖(OUT_OF_SCOPE)
      x-trace-error-codes: [FORBIDDEN, OUT_OF_SCOPE]
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: 접근할 수 없는 렌탈입니다
            status: 403
            code: OUT_OF_SCOPE
    NotFound:
      description: 대상 없음 (NOT_FOUND)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: 찾을 수 없습니다
            status: 404
            code: NOT_FOUND
    TooManyRequests:
      description: 요청 제한 초과 (IP당 분당 10회, RATE_LIMITED)
      headers:
        Retry-After:
          description: 다시 시도할 수 있을 때까지 초
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: 요청이 너무 많습니다
            status: 429
            code: RATE_LIMITED
    CatalogTooManyRequests:
      description: 요청 제한 초과 (공개 보유 기기 목록 경로들을 합쳐 IP당 분당 300회, RATE_LIMITED)
      headers:
        Retry-After:
          description: 다시 시도할 수 있을 때까지 초
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: 요청이 너무 많습니다
            status: 429
            code: RATE_LIMITED
